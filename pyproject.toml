[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "social-media-collector"
version = "0.1.0"
description = "Standalone Douyin, Xiaohongshu and Bilibili collectors extracted from Taiyi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31,<3",
  "yt-dlp>=2025.1.0",
]

[project.scripts]
social-collector = "social_collector.cli:main"

[tool.setuptools.packages.find]
include = ["social_collector*"]
